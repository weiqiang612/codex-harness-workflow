<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minimal Task Board</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; }
      li { margin: 0.75rem 0; }
    </style>
  </head>
  <body>
    <h1>Tasks</h1>
    <ul id="tasks"><li>Loading…</li></ul>
    <script>
      fetch('/api/tasks')
        .then((response) => response.json())
        .then((tasks) => {
          document.querySelector('#tasks').innerHTML = tasks
            .map((task) => `<li data-task-id="${task.id}">${task.title}</li>`)
            .join('');
        });
    </script>
  </body>
</html>
